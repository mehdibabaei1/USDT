name: Tether Price Update

on:
  schedule:
    # هر 5 دقیقه اجرا می‌شود (کمترین بازه‌ای که GitHub Actions به‌طور واقع‌بینانه پشتیبانی می‌کند)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # امکان اجرای دستی از تب Actions برای تست

jobs:
  send-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ABANTETHER_API_KEY: ${{ secrets.ABANTETHER_API_KEY }}
        run: python tether_price_bot.py
